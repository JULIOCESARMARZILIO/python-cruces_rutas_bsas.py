<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caminos rurales — Partido de 25 de Mayo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #mapa { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,.96); color: #111; padding: 14px 16px;
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.3);
    max-width: 300px; max-height: 92vh; overflow:auto; font-size: 14px;
  }
  #panel h1 { font-size: 16px; margin: 0 28px 2px 0; }
  #cerrar { position:absolute; top:8px; right:10px; z-index:1001; cursor:pointer;
    border:none; background:#eee; color:#111; width:24px; height:24px; border-radius:12px;
    font-size:15px; line-height:1; }
  #reabrir { position:absolute; top:10px; left:10px; z-index:1000; cursor:pointer; display:none;
    border:none; background:rgba(255,255,255,.96); color:#b02a00; font-weight:700;
    padding:8px 12px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.3); font-size:14px; }
  #panel .sub { color:#555; font-size:12px; margin-bottom:10px; }
  .total { font-size: 26px; font-weight: 700; color:#b02a00; line-height:1.1; }
  .total small { font-size: 13px; font-weight: 400; color:#444; }
  table { border-collapse: collapse; width:100%; margin-top:10px; font-size:13px; }
  td { padding: 2px 4px; border-bottom: 1px solid #eee; }
  td.k { color:#333; } td.v { text-align:right; font-variant-numeric: tabular-nums; }
  .leyenda { margin-top:10px; font-size:12px; border-top:1px solid #ddd; padding-top:8px; }
  .ln { display:inline-block; width:18px; height:0; border-top:3px solid; margin-right:6px; vertical-align:middle; }
  #cargando { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:1000;
    background:#111b; color:#fff; padding:6px 12px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="cargando">Cargando caminos…</div>
<button id="reabrir">ℹ Ver datos</button>
<div id="panel">
  <button id="cerrar" title="Cerrar">✕</button>
  <h1>Partido de 25 de Mayo</h1>
  <div class="sub" id="area">Buenos Aires</div>
  <div class="total" id="totalRural">— <small>km de caminos rurales</small></div>
  <div id="totalRed" class="sub"></div>
  <table id="tabla"></table>
  <div class="leyenda" style="border-top:none;padding-top:0">
    <label><input type="checkbox" id="c_aguas" checked> Ríos, arroyos y canales</label><br>
    <label><input type="checkbox" id="c_cx_agua" checked> Cruces camino × arroyo <span id="n_cx_agua"></span></label><br>
    <label><input type="checkbox" id="c_cx_ruta"> Empalmes camino × ruta <span id="n_cx_ruta"></span></label><br>
    <label><input type="checkbox" id="c_parcelas" checked> Parcelas dibujadas <span id="n_parc"></span></label><br>
    <label><input type="checkbox" id="c_puertos" checked> Puertos de granos <span id="n_puertos"></span></label>
    <div class="sub" style="margin-top:4px"><a href="marcar.html">Dibujar parcelas →</a></div>
  </div>
  <div class="leyenda">
    <div><span class="ln" style="border-color:#b02a00"></span>Caminos rurales (tierra)</div>
    <div><span class="ln" style="border-color:#1664c0"></span>Rutas y pavimento</div>
    <div><span class="ln" style="border-color:#0a8fd0"></span>Ríos y arroyos</div>
    <div><span class="ln" style="border-color:#6b3fa0;border-top-style:dashed"></span>Límite del partido</div>
    <div>⚓ Terminal portuaria de granos (km por ruta desde 25 de Mayo)</div>
  </div>
  <table id="tabla_puertos"></table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const mapa = L.map('mapa');
const baseMapa = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
const baseSat = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Imágenes © Esri' });
L.control.layers({ 'Mapa': baseMapa, 'Satélite': baseSat }, {},
  { position:'topright', collapsed:false }).addTo(mapa);

const RURAL = new Set(['track','unclassified','residential']);
const cargando = document.getElementById('cargando');
const capas = {};
function etiqueta(p){ return '<b>'+(p.nombre||p.waterway||'')+'</b>'; }
async function geo(url){
  try{ const r = await fetch(url); if (!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
async function cargarCapas(){
  const aguas = await geo('aguas_25_de_mayo.geojson');
  if (aguas) capas.aguas = L.geoJSON(aguas, {
    style: f => ({ color:'#0a8fd0', weight: f.properties.waterway==='river'?3:1.6, opacity:.9 }),
    onEachFeature:(f,l)=>l.bindPopup(etiqueta(f.properties)||'Curso de agua') });
  const cx = await geo('cruces_25_de_mayo.geojson');
  if (cx){
    const mk = tipo => L.geoJSON({type:'FeatureCollection',
      features: cx.features.filter(f=>f.properties.tipo===tipo)}, {
      pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,weight:1.5,color:'#fff',
        fillColor: tipo==='camino_x_agua'?'#0a8fd0':'#e08a00', fillOpacity:1}),
      onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.camino+'</b> cruza <b>'+f.properties.cruza+'</b>') });
    capas.cx_agua = mk('camino_x_agua'); capas.cx_ruta = mk('camino_x_ruta');
    document.getElementById('n_cx_agua').textContent = '('+capas.cx_agua.getLayers().length+')';
    document.getElementById('n_cx_ruta').textContent = '('+capas.cx_ruta.getLayers().length+')';
  }
  const parc = await geo('parcelas.geojson');
  if (parc){
    capas.parcelas = L.geoJSON(parc, {
      style:{ color:'#7a4b00', weight:2, fillColor:'#f3c14b', fillOpacity:.25 },
      onEachFeature:(f,l)=>{ const p=f.properties;
        l.bindPopup('<b>'+p.propietario+'</b>'+(p.hectareas?'<br>'+p.hectareas+' ha':'')
          +(p.cuartel?'<br>Cuartel '+p.cuartel:'')); } });
    document.getElementById('n_parc').textContent = '('+parc.features.length+')';
  }
  const pu = await geo('puertos_granos.geojson');
  if (pu){
    const esc = s => (s==null?'':String(s)).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const icono = L.divIcon({className:'', html:'<div style="background:#8a3ffc;color:#fff;border:2px solid #fff;'
      +'border-radius:50%;width:22px;height:22px;line-height:18px;text-align:center;font-size:13px;'
      +'box-shadow:0 1px 4px #0008">⚓</div>', iconSize:[22,22], iconAnchor:[11,11]});
    capas.puertos = L.geoJSON(pu, {
      pointToLayer:(f,ll)=>L.marker(ll,{icon:icono, title:f.properties.terminal}),
      onEachFeature:(f,l)=>{ const p=f.properties;
        l.bindPopup('<b>'+esc(p.terminal)+'</b><br>'+esc(p.empresa)+'<br>'+esc(p.localidad)+', '+esc(p.provincia)
          +(p.km_por_ruta?'<br><b>'+esc(p.km_por_ruta)+' km por ruta</b>'+(p.horas_camion?' (~'+esc(p.horas_camion)+' h de camión)':''):'')
          +'<br><a href="'+esc(p.google_maps)+'" target="_blank">ver en Google Maps</a>'
          +(p.como_llegar?' · <a href="'+esc(p.como_llegar)+'" target="_blank">cómo llegar</a>':'')); } });
    document.getElementById('n_puertos').textContent = '('+pu.features.length+')';
    // los 8 más cercanos por ruta, en el panel
    const t = document.getElementById('tabla_puertos');
    const orden = pu.features.map(f=>f.properties).filter(p=>p.km_por_ruta!=='')
      .sort((a,b)=>a.km_por_ruta-b.km_por_ruta).slice(0,8);
    if (orden.length) t.innerHTML = '<tr><td class="k"><b>Puerto más cercano</b></td><td class="v"><b>km ruta</b></td></tr>'
      + orden.map(p=>'<tr><td class="k">'+esc(p.terminal)+'</td><td class="v">'+fmt(p.km_por_ruta)+'</td></tr>').join('');
  }
  for (const [k,id] of [['aguas','c_aguas'],['cx_agua','c_cx_agua'],['cx_ruta','c_cx_ruta'],['parcelas','c_parcelas'],['puertos','c_puertos']]){
    const cb = document.getElementById(id);
    const act = () => { if (!capas[k]) return; cb.checked ? capas[k].addTo(mapa) : mapa.removeLayer(capas[k]); };
    cb.onchange = act; act();
  }
}
function fmt(n){ return (Math.round(n*10)/10).toLocaleString('es-AR'); }

async function init(){
  // límite del partido
  try{
    const rl = await fetch('caminos_25_de_mayo_limite.geojson');
    if (rl.ok){
      const gl = await rl.json();
      const cap = L.geoJSON(gl, { style:{ color:'#6b3fa0', weight:2, dashArray:'6 5',
        fill:true, fillColor:'#6b3fa0', fillOpacity:.05 } }).addTo(mapa);
      mapa.fitBounds(cap.getBounds(), { padding:[20,20] });
    } else { mapa.setView([-35.43,-60.17], 10); }
  }catch(e){ mapa.setView([-35.43,-60.17], 10); }

  // caminos
  try{
    const r = await fetch('caminos_25_de_mayo.geojson');
    const gj = await r.json();
    L.geoJSON(gj, {
      style: f => RURAL.has(f.properties.highway)
        ? { color:'#b02a00', weight:1.2, opacity:.85 }
        : { color:'#1664c0', weight:1.8, opacity:.9 },
      onEachFeature: (f,l)=>{
        const p=f.properties||{};
        l.bindPopup((p.nombre||p.highway)+(p.ref?(' ('+p.ref+')'):'')+' — '+fmt(p.km)+' km');
      }
    }).addTo(mapa);
  }catch(e){ console.warn('caminos', e); }

  await cargarCapas();

  // resumen (panel)
  try{
    const rr = await fetch('caminos_25_de_mayo_resumen.json');
    const s = await rr.json();
    document.getElementById('area').textContent =
      'Buenos Aires · '+fmt(s.area_km2)+' km²';
    document.getElementById('totalRural').innerHTML =
      fmt(s.km_caminos_rurales)+' <small>km de caminos rurales</small>';
    document.getElementById('totalRed').textContent =
      'Red vial total: '+fmt(s.km_total)+' km · '+s.cantidad_vias+' tramos';
    const t=document.getElementById('tabla');
    const et={unclassified:'Caminos rurales (tierra)',track:'Huellas',residential:'Calles de pueblo',
      tertiary:'Terciarias',secondary:'Secundarias',primary:'Primarias',service:'Servicio/internos'};
    for (const [k,v] of Object.entries(s.km_por_tipo)){
      if (v<1) continue;
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="k">'+(et[k]||k)+'</td><td class="v">'+fmt(v)+' km</td>';
      t.appendChild(tr);
    }
  }catch(e){ console.warn('resumen', e); }
  cargando.style.display='none';
}
init();

// cerrar / reabrir el panel (en celular tapa el mapa)
const panel=document.getElementById('panel'), cerrar=document.getElementById('cerrar'),
      reabrir=document.getElementById('reabrir');
cerrar.onclick=()=>{ panel.style.display='none'; reabrir.style.display='block'; };
reabrir.onclick=()=>{ panel.style.display='block'; reabrir.style.display='none'; };
if (window.innerWidth < 560){ panel.style.display='none'; reabrir.style.display='block'; }
</script>
</body>
</html>
