<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campos y caminos rurales — Partido de 25 de Mayo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #mapa { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,.96); color: #111; padding: 14px 16px;
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.3);
    max-width: 300px; max-height: 92vh; overflow:auto; font-size: 14px;
  }
  #panel h1 { font-size: 16px; margin: 0 28px 2px 0; }
  #cerrar { position:absolute; top:8px; right:10px; z-index:1001; cursor:pointer;
    border:none; background:#eee; color:#111; width:24px; height:24px; border-radius:12px;
    font-size:15px; line-height:1; }
  #reabrir { position:absolute; top:10px; left:10px; z-index:1000; cursor:pointer; display:none;
    border:none; background:rgba(255,255,255,.96); color:#b02a00; font-weight:700;
    padding:8px 12px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.3); font-size:14px; }
  #panel .sub { color:#555; font-size:12px; margin-bottom:10px; }
  .total { font-size: 26px; font-weight: 700; color:#b02a00; line-height:1.1; }
  .total small { font-size: 13px; font-weight: 400; color:#444; }
  table { border-collapse: collapse; width:100%; margin-top:10px; font-size:13px; }
  td { padding: 2px 4px; border-bottom: 1px solid #eee; }
  td.k { color:#333; } td.v { text-align:right; font-variant-numeric: tabular-nums; }
  .leyenda { margin-top:10px; font-size:12px; border-top:1px solid #ddd; padding-top:8px; }
  .ln { display:inline-block; width:18px; height:0; border-top:3px solid; margin-right:6px; vertical-align:middle; }
  .camp { font-size:13px; margin-top:10px; border-top:1px solid #ddd; padding-top:8px; }
  .camp b.big { font-size:20px; color:#2b6b00; }
  .pop select, .pop button { font-size:14px; max-width:240px; margin-top:4px; }
  #cargando { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:1000;
    background:#111b; color:#fff; padding:6px 12px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="cargando">Cargando caminos…</div>
<button id="reabrir">ℹ Ver datos</button>
<div id="panel">
  <button id="cerrar" title="Cerrar">✕</button>
  <h1>Partido de 25 de Mayo</h1>
  <div class="sub" id="area">Buenos Aires</div>
  <div class="total" id="totalRural">— <small>km de caminos rurales</small></div>
  <div id="totalRed" class="sub"></div>
  <div id="totalCat" class="sub"></div>
  <table id="tabla"></table>
  <div class="camp" id="campStats"></div>
  <div class="leyenda" style="border-top:none;padding-top:0">
    <label><input type="checkbox" id="c_aguas" checked> Ríos, arroyos y canales</label><br>
    <label><input type="checkbox" id="c_cx_agua" checked> Cruces camino × arroyo <span id="n_cx_agua"></span></label><br>
    <label><input type="checkbox" id="c_cx_ruta"> Empalmes camino × ruta <span id="n_cx_ruta"></span></label><br>
    <label><input type="checkbox" id="c_catastro" checked> Caminos del catastro ARBA <span id="n_cat"></span></label><br>
    <label><input type="checkbox" id="c_arba"> Parcelas ARBA (tocá una para asignarla) <span id="n_arba"></span></label><br>
    <label><input type="checkbox" id="c_campos" checked> Campos ubicados <span id="n_campos"></span></label><br>
    <label><input type="checkbox" id="c_parcelas" checked> Parcelas dibujadas <span id="n_parc"></span></label>
    <div class="sub" style="margin-top:4px"><a href="marcar.html">Dibujar parcelas →</a> · <a href="campos_25_de_mayo.html">Tabla de propietarios →</a></div>
  </div>
  <div class="leyenda">
    <div><span class="ln" style="border-color:#b02a00"></span>Caminos rurales (tierra, OSM)</div>
    <div><span class="ln" style="border-color:#ff1493;border-top-width:4px"></span>Camino del catastro que falta en OSM</div>
    <div><span class="ln" style="border-color:#5a3a1a"></span>Camino del catastro (ya en OSM)</div>
    <div><span class="ln" style="border-color:#2b6b00;border-top-width:6px"></span>Campo ubicado</div>
    <div><span class="ln" style="border-color:#1664c0"></span>Rutas y pavimento</div>
    <div><span class="ln" style="border-color:#0a8fd0"></span>Ríos y arroyos</div>
    <div><span class="ln" style="border-color:#6b3fa0;border-top-style:dashed"></span>Límite del partido</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const mapa = L.map('mapa', { preferCanvas: true });
const baseMapa = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
const baseSat = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Imágenes © Esri' });
L.control.layers({ 'Mapa': baseMapa, 'Satélite': baseSat }, {},
  { position:'topright', collapsed:false }).addTo(mapa);

const RURAL = new Set(['track','unclassified','residential']);
const cargando = document.getElementById('cargando');
const capas = {};
function etiqueta(p){ return '<b>'+(p.nombre||p.waterway||'')+'</b>'; }
async function geo(url){
  try{ const r = await fetch(url); if (!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
async function cargarCapas(){
  const aguas = await geo('aguas_25_de_mayo.geojson');
  if (aguas) capas.aguas = L.geoJSON(aguas, {
    style: f => ({ color:'#0a8fd0', weight: f.properties.waterway==='river'?3:1.6, opacity:.9 }),
    onEachFeature:(f,l)=>l.bindPopup(etiqueta(f.properties)||'Curso de agua') });
  const cx = await geo('cruces_25_de_mayo.geojson');
  if (cx){
    const mk = tipo => L.geoJSON({type:'FeatureCollection',
      features: cx.features.filter(f=>f.properties.tipo===tipo)}, {
      pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,weight:1.5,color:'#fff',
        fillColor: tipo==='camino_x_agua'?'#0a8fd0':'#e08a00', fillOpacity:1}),
      onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.camino+'</b> cruza <b>'+f.properties.cruza+'</b>') });
    capas.cx_agua = mk('camino_x_agua'); capas.cx_ruta = mk('camino_x_ruta');
    document.getElementById('n_cx_agua').textContent = '('+capas.cx_agua.getLayers().length+')';
    document.getElementById('n_cx_ruta').textContent = '('+capas.cx_ruta.getLayers().length+')';
  }
  const parc = await geo('parcelas.geojson');
  if (parc){
    capas.parcelas = L.geoJSON(parc, {
      style:{ color:'#7a4b00', weight:2, fillColor:'#f3c14b', fillOpacity:.25 },
      onEachFeature:(f,l)=>{ const p=f.properties;
        l.bindPopup('<b>'+p.propietario+'</b>'+(p.hectareas?'<br>'+p.hectareas+' ha':'')
          +(p.cuartel?'<br>Cuartel '+p.cuartel:'')); } });
    document.getElementById('n_parc').textContent = '('+parc.features.length+')';
  }
  await cargarCatastro();
  for (const [k,id] of [['aguas','c_aguas'],['cx_agua','c_cx_agua'],['cx_ruta','c_cx_ruta'],['parcelas','c_parcelas'],
                        ['catastro','c_catastro'],['arba','c_arba'],['campos','c_campos']]){
    const cb = document.getElementById(id);
    const act = () => { if (!capas[k]) return; cb.checked ? capas[k].addTo(mapa) : mapa.removeLayer(capas[k]); };
    cb.onchange = act; act();
  }
}
// ---- catastro ARBA: caminos (huecos entre parcelas), parcelas y campos del plano ----
let LISTA = [];
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function cargarCatastro(){
  const cat = await geo('caminos_catastro_25_de_mayo.geojson');
  if (cat){
    capas.catastro = L.geoJSON(cat, {
      style: f => f.properties.en_osm==='no'
        ? { color:'#ff1493', weight:3, opacity:.95 }
        : { color:'#5a3a1a', weight:1.6, opacity:.8 },
      onEachFeature:(f,l)=>{ const p=f.properties;
        l.bindPopup('<b>Camino rural</b> (catastro ARBA)<br>'+fmt(p.km)+' km · ancho ~'+p.ancho_m+' m'
          +'<br>Cuartel '+esc(p.cuartel)+'<br>'+(p.en_osm==='no'?'<b style="color:#c00">No figura en OpenStreetMap</b>':'Figura en OpenStreetMap')); } });
    document.getElementById('n_cat').textContent = '('+cat.features.length+')';
    if (cat.resumen) document.getElementById('totalCat').innerHTML =
      'Catastro ARBA: <b>'+fmt(cat.resumen.km_caminos)+' km</b> de caminos, <b style="color:#c00">'
      +fmt(cat.resumen.km_que_faltan_en_osm)+' km</b> no están en OSM';
  }
  LISTA = (await geo('campos_25_de_mayo_lista.json')) || [];
  const asignada = {};
  for (const c of LISTA) for (const p of c[4]) asignada[p] = c;
  const arba = await geo('parcelas_arba_25_de_mayo.geojson');
  if (arba){
    capas.arba = L.geoJSON(arba, {
      style: f => ({ color:'#555', weight:.6, fillColor: asignada[f.properties.partida]?'#5cb85c':'#999',
                     fillOpacity: asignada[f.properties.partida]?.25:.06 }),
      onEachFeature:(f,l)=>l.on('click', e => popupParcela(f.properties, asignada[f.properties.partida], e.latlng)) });
    document.getElementById('n_arba').textContent = '('+arba.features.length+')';
  }
  const campos = await geo('campos_25_de_mayo.geojson');
  if (campos){
    capas.campos = L.geoJSON(campos, {
      style: { color:'#2b6b00', weight:2.5, fillColor:'#7ed957', fillOpacity:.35 },
      pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#fff',weight:1.5,fillColor:'#2b6b00',fillOpacity:1}),
      onEachFeature:(f,l)=>{ const p=f.properties;
        l.bindPopup('<b>'+esc(p.propietario)+'</b><br>'+(p.hectareas?esc(p.hectareas)+' ha (plano)':'sin ha en el plano')
          +(p.ha_arba?' · '+fmt(+p.ha_arba)+' ha (ARBA)':'')+'<br>Cuartel '+esc(p.cuartel)
          +'<br>Tipo: '+(p.tipo?esc(p.tipo):'<i>sin dato</i>')+' · '+esc(p.tipo_titular)
          +(p.partidas?'<br>Partida: '+esc(p.partidas):'')+'<br><small>Ubicado: '+esc(p.ubicado)+'</small>'); } });
    document.getElementById('n_campos').textContent = '('+campos.features.length+')';
  }
  const s = await geo('campos_25_de_mayo_resumen.json');
  if (s){
    const pc=s.por_campo||{}, pp=s.por_propietario||{};
    document.getElementById('campStats').innerHTML =
      '<b class="big">'+s.campos.toLocaleString('es-AR')+'</b> campos · <b>'+s.propietarios.toLocaleString('es-AR')+'</b> propietarios'
      +'<br>'+fmt(s.ha_total)+' ha con dato (ARBA rural: '+fmt(s.ha_rural_arba)+' ha)'
      +'<table><tr><td class="k">Promedio por campo</td><td class="v">'+fmt(pc.promedio)+' ha</td></tr>'
      +'<tr><td class="k">Mediana por campo</td><td class="v">'+fmt(pc.mediana)+' ha</td></tr>'
      +'<tr><td class="k">Promedio por propietario</td><td class="v">'+fmt(pp.promedio)+' ha</td></tr>'
      +'<tr><td class="k">Mediana por propietario</td><td class="v">'+fmt(pp.mediana)+' ha</td></tr>'
      +'<tr><td class="k">Los 10 más grandes tienen</td><td class="v">'+fmt(s.top10_pct_superficie)+' %</td></tr>'
      +'<tr><td class="k">Campos ubicados en el mapa</td><td class="v">'+s.campos_ubicados+'</td></tr></table>';
  }
}
function popupParcela(p, actual, ll){
  const cands = LISTA.filter(c => c[1]===p.cuartel)
    .sort((a,b) => Math.abs((a[3]||1e9)-p.ha) - Math.abs((b[3]||1e9)-p.ha)).slice(0,60);
  if (actual && !cands.includes(actual)) cands.unshift(actual);
  const opts = cands.map(c => '<option value="'+esc(c[0])+'"'+(actual&&actual[0]===c[0]?' selected':'')+'>'
    +esc(c[2])+' — '+(c[3]!=null?c[3]+' ha':'s/ha')+(c[4].length?' ✓':'')+'</option>').join('');
  const div = document.createElement('div'); div.className='pop';
  div.innerHTML = '<b>Parcela ARBA '+esc(p.partida)+'</b><br>'+fmt(p.ha)+' ha · Cuartel '+esc(p.cuartel)
    +'<br>'+(actual?'Asignada a <b>'+esc(actual[2])+'</b>':'<i>Sin campo asignado</i>')
    +'<br><select><option value="">— elegir campo del plano —</option>'+opts+'</select>'
    +'<br><button data-a="sumar">Asignar</button> '+(actual?'<button data-a="quitar">Quitar</button>':'')
    +'<div class="sub" style="margin-top:4px">Ordenados por parecido en hectáreas. "Asignar" suma esta parcela al campo.</div>';
  div.onclick = async e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    let cid, partidas;
    if (a==='quitar'){ cid = actual[0]; partidas = actual[4].filter(x => x!==p.partida); }
    else {
      cid = div.querySelector('select').value; if (!cid) return alert('Elegí un campo');
      const c = LISTA.find(x => String(x[0])===cid);
      partidas = [...new Set([...(c[4]||[]), p.partida])];
      if (actual && String(actual[0])!==cid){ // sacarla del campo anterior
        await enviar(actual[0], actual[4].filter(x => x!==p.partida)); }
    }
    e.target.disabled = true; e.target.textContent = 'Guardando…';
    if (await enviar(cid, partidas)) location.reload(); else { e.target.textContent='Error'; }
  };
  L.popup().setLatLng(ll).setContent(div).openOn(mapa);
}
async function enviar(campo_id, partidas){
  try{ const r = await fetch('api/asignar',{method:'POST',headers:{'Content-Type':'application/json'},
         body: JSON.stringify({campo_id:String(campo_id), partidas})});
       return (await r.json()).ok; }catch(e){ return false; }
}
function fmt(n){ return n==null||isNaN(n) ? '—' : (Math.round(n*10)/10).toLocaleString('es-AR'); }

async function init(){
  // límite del partido
  try{
    const rl = await fetch('caminos_25_de_mayo_limite.geojson');
    if (rl.ok){
      const gl = await rl.json();
      const cap = L.geoJSON(gl, { style:{ color:'#6b3fa0', weight:2, dashArray:'6 5',
        fill:true, fillColor:'#6b3fa0', fillOpacity:.05 } }).addTo(mapa);
      mapa.fitBounds(cap.getBounds(), { padding:[20,20] });
    } else { mapa.setView([-35.43,-60.17], 10); }
  }catch(e){ mapa.setView([-35.43,-60.17], 10); }

  // caminos
  try{
    const r = await fetch('caminos_25_de_mayo.geojson');
    const gj = await r.json();
    L.geoJSON(gj, {
      style: f => RURAL.has(f.properties.highway)
        ? { color:'#b02a00', weight:1.2, opacity:.85 }
        : { color:'#1664c0', weight:1.8, opacity:.9 },
      onEachFeature: (f,l)=>{
        const p=f.properties||{};
        l.bindPopup((p.nombre||p.highway)+(p.ref?(' ('+p.ref+')'):'')+' — '+fmt(p.km)+' km');
      }
    }).addTo(mapa);
  }catch(e){ console.warn('caminos', e); }

  await cargarCapas();

  // resumen (panel)
  try{
    const rr = await fetch('caminos_25_de_mayo_resumen.json');
    const s = await rr.json();
    document.getElementById('area').textContent =
      'Buenos Aires · '+fmt(s.area_km2)+' km²';
    document.getElementById('totalRural').innerHTML =
      fmt(s.km_caminos_rurales)+' <small>km de caminos rurales</small>';
    document.getElementById('totalRed').textContent =
      'Red vial total: '+fmt(s.km_total)+' km · '+s.cantidad_vias+' tramos';
    const t=document.getElementById('tabla');
    const et={unclassified:'Caminos rurales (tierra)',track:'Huellas',residential:'Calles de pueblo',
      tertiary:'Terciarias',secondary:'Secundarias',primary:'Primarias',service:'Servicio/internos'};
    for (const [k,v] of Object.entries(s.km_por_tipo)){
      if (v<1) continue;
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="k">'+(et[k]||k)+'</td><td class="v">'+fmt(v)+' km</td>';
      t.appendChild(tr);
    }
  }catch(e){ console.warn('resumen', e); }
  cargando.style.display='none';
}
init();

// cerrar / reabrir el panel (en celular tapa el mapa)
const panel=document.getElementById('panel'), cerrar=document.getElementById('cerrar'),
      reabrir=document.getElementById('reabrir');
cerrar.onclick=()=>{ panel.style.display='none'; reabrir.style.display='block'; };
reabrir.onclick=()=>{ panel.style.display='block'; reabrir.style.display='none'; };
if (window.innerWidth < 560){ panel.style.display='none'; reabrir.style.display='block'; }
</script>
</body>
</html>
